[package]
name = "rust_search_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
tantivy = "0.22"
scraper = "0.20"
reqwest = { version = "0.12", features = ["blocking"] }
url = "2.5"
anyhow = "1.0"
csv = "1.3"
